<!doctype html>

<head>

<title>病態生理 ○×クイズ</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#152033;--muted:#64748b;--line:#e5eaf2;--accent:#2563eb;--accent2:#1d4ed8;--ok:#15803d;--ng:#dc2626;--warn:#b45309;--shadow:0 12px 35px rgba(15,23,42,.08);}
*{box-sizing:border-box} body{margin:0;-webkit-text-size-adjust:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:linear-gradient(180deg,#eef4ff 0,#f8fafc 260px,var(--bg) 100%);color:var(--ink);min-height:100vh}
button{font:inherit} .app{width:min(980px,92vw);margin:0 auto;padding:26px 0 60px;padding-left:max(0px,env(safe-area-inset-left));padding-right:max(0px,env(safe-area-inset-right))}
header{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.brand h1{margin:0;font-size:clamp(22px,4vw,34px);letter-spacing:.02em}.brand p{margin:7px 0 0;color:var(--muted);font-size:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{background:rgba(255,255,255,.85);border:1px solid var(--line);padding:8px 11px;border-radius:999px;font-size:13px;box-shadow:0 5px 18px rgba(15,23,42,.04)}
.card{background:var(--card);border:1px solid rgba(148,163,184,.16);box-shadow:var(--shadow);border-radius:22px;padding:24px}.hidden{display:none!important}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.menu button{padding:18px;border-radius:16px;border:1px solid var(--line);background:#fff;cursor:pointer;text-align:left;transition:.18s}.menu button:hover{transform:translateY(-2px);border-color:#bfdbfe;box-shadow:0 10px 24px rgba(37,99,235,.08)}.menu strong{display:block;font-size:16px;margin-bottom:7px}.menu span{color:var(--muted);font-size:13px;line-height:1.55}
.notice{margin-top:16px;padding:12px 14px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:13px;color:#475569;font-size:12px;line-height:1.7}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.section{color:var(--muted);font-size:13px}.qnum{font-weight:800;color:var(--accent)}
.progress{height:8px;background:#e8eef7;border-radius:999px;overflow:hidden;margin:12px 0 24px}.progress>div{height:100%;background:linear-gradient(90deg,var(--accent),#60a5fa);width:0;transition:.25s}
.question{font-size:clamp(21px,4vw,30px);font-weight:750;line-height:1.65;margin:28px 0 26px;letter-spacing:.01em}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choice{min-height:78px;border-radius:18px;border:2px solid #dbe3ee;background:#fff;cursor:pointer;font-size:22px;font-weight:800;transition:.18s}.choice:hover{border-color:#93c5fd;background:#eff6ff;transform:translateY(-2px)}
.subchoice{width:100%;padding:15px;border-radius:15px;border:1px solid var(--line);background:#fff;cursor:pointer}.subchoice:hover{border-color:#93c5fd}.review-choice{grid-template-columns:1fr 1fr;display:grid;gap:12px}.review-choice button{padding:16px;border-radius:14px;border:1px solid var(--line);background:#fff;cursor:pointer}
.feedback{margin-top:22px;padding:20px;border-radius:18px;border:1px solid var(--line);line-height:1.8}.feedback.ok{background:#f0fdf4;border-color:#bbf7d0}.feedback.ng{background:#fef2f2;border-color:#fecaca}.feedback.warn{background:#fffbeb;border-color:#fde68a}.feedback h3{margin:0 0 8px;font-size:20px}.point{font-weight:750}.explain{margin-top:12px;color:#334155}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.primary,.secondary,.danger{border:0;border-radius:14px;padding:13px 18px;cursor:pointer;font-weight:750}.primary{background:var(--accent);color:#fff}.primary:hover{background:var(--accent2)}.secondary{background:#eef2f7;color:#233047}.danger{background:#fee2e2;color:#991b1b}
.result{text-align:center}.result h2{margin:0 0 8px;font-size:30px}.bigscore{font-size:48px;font-weight:900;margin:16px 0}.result p{color:var(--muted)}
.wrong-list{margin-top:16px;display:grid;gap:10px}.wrong-item{padding:14px;border:1px solid var(--line);border-radius:15px;background:#fff;display:flex;justify-content:space-between;gap:14px;align-items:center}.wrong-item .meta{min-width:0}.wrong-item strong{display:block;margin-bottom:4px}.wrong-item small{color:var(--muted)}
footer{margin-top:20px;color:#64748b;font-size:12px;line-height:1.65;text-align:center}
@media (max-width:720px){body{font-size:16px}.app{width:min(94vw,680px);padding-top:16px;padding-bottom:32px}header{flex-direction:column}.stats{justify-content:flex-start}.menu{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.review-choice{grid-template-columns:1fr}.question{font-size:22px;line-height:1.7}.card{padding:18px;border-radius:18px}.choice{min-height:72px;font-size:24px}.primary,.secondary,.danger{min-height:48px;padding:12px 16px}.actions{gap:10px}.actions button{flex:1 1 auto}.wrong-item{align-items:flex-start;flex-direction:column}}
</style>

<body>
<div class="app">
  <header>
    <div class="brand"><h1>病態生理 ○×クイズ</h1><p>問題だけ表示 → 回答 → 解答・解説 → 間違えた問題を復習</p></div>
    <div class="stats"><div class="pill">全75問</div><div class="pill" id="wrongPill">間違えた問題 0</div></div>
  </header>

  <section id="home" class="card">
    <div class="menu">
      <button id="startAll"><strong>▶ 全問題から開始</strong><span>問題順を毎回シャッフルして出題します。途中までの進捗は自動保存されます。</span></button>
      <button id="startWrong"><strong>↻ 間違えた問題を復習</strong><span>これまでに間違えた問題だけを繰り返します。</span></button>
      <button id="resetWrong"><strong>🗑 復習リストをリセット</strong><span>「間違えた問題」を0問に戻します。</span></button>
    </div>
    <div class="notice">このサイトの問題・解答・解説は、アップロードされた「病態生理 選択肢問題 解答解説」の内容をもとにしています。資料内で「！」とされている問題は、単純な○×ではなく条件や解釈に注意が必要な問題として扱います。事例問題は回答後に模範ポイントを表示し、自分で復習対象にするか選べます。</div>
  </section>

  <section id="quiz" class="card hidden">
    <div class="toprow"><div class="section" id="sectionName"></div><div class="qnum" id="progressText"></div></div>
    <div class="progress"><div id="progressBar"></div></div>
    <div id="questionArea"></div>
    <div id="feedbackArea"></div>
    <div class="actions" id="actions"></div>
  </section>

  <section id="result" class="card hidden result">
    <h2 id="resultTitle">終了</h2>
    <p id="resultText"></p><div class="bigscore" id="resultScore"></div>
    <div class="actions" style="justify-content:center"><button class="primary" id="againWrong">間違えた問題を復習</button><button class="secondary" id="backHome">ホームに戻る</button></div>
    <div id="wrongListWrap"></div>
  </section>

  <footer>学習記録はこのブラウザのローカルストレージに保存されます。別の端末・ブラウザには自動では引き継がれません。</footer>
</div>

<script>
const DATA = {"title":"病態生理 選択肢問題","questions":[{"id":"Q1-1","question":"長時間立って起こる浮腫は足の充血である","section":"1. 循環・体温・体液","marker":"×","point":"うっ血が正しい","explanation":"長時間の起立により下肢の静脈還流（血液を心臓に戻す働き）が重力に逆らえず滞ると、静脈内に血液が過剰にた まる「うっ血」が生じる。うっ血により毛細血管の静脈側の圧が上がり、血漿成分が間質へ滲み出て浮腫となる。「充 血」は動脈血流入の増加を指す用語であり、機序が異なるため誤り。","type":"tf","answer":"×"},{"id":"Q1-2","question":"32℃以下の低体温では激しい震えがおきる","section":"1. 循環・体温・体液","marker":"×","point":"32℃以下では震え（シバリング）はむしろ減少・消失する","explanation":"シバリング（骨格筋の不随意収縮による産熱）は体温調節反応の一つだが、深部体温がおよそ32〜35℃を下回る中 等度以上の低体温になると、筋の代謝機能自体が低下し、シバリングは減弱・消失する。32℃以下は「震えが最も激し くなる」段階ではなく、むしろ体温調節機構が破綻し始める段階である。","type":"tf","answer":"×"},{"id":"Q1-3","question":"解熱時は皮膚血流は増加する","section":"1. 循環・体温・体液","marker":"○","point":"正しい","explanation":"発熱時は体温を上げるため皮膚血管が収縮し放熱を抑えるが、解熱期（体温が下降する時期）にはセットポイント が下がり、体内の余分な熱を放散するために皮膚血管が拡張し血流が増加する。これにより発汗も促進される。","type":"tf","answer":"○"},{"id":"Q1-4","question":"酸素が不足している状態では乳酸が生じやすい","section":"1. 循環・体温・体液","marker":"○","point":"正しい（解糖系）","explanation":"酸素が不足すると、細胞はミトコンドリアでの好気的代謝（TCA回路・電子伝達系）を十分に行えなくなり、解糖 系で生じたピルビン酸は乳酸脱水素酵素によって乳酸に変換される（嫌気的解糖）。この結果、組織や血中の乳酸が増 加する（乳酸アシドーシス）。","type":"tf","answer":"○"},{"id":"Q1-5","question":"水欠乏性脱水では低張性電解質輸液を投与する","section":"1. 循環・体温・体液","marker":"○","point":"正しい","explanation":"水欠乏性脱水（高張性脱水）は水分が電解質より多く失われ、血漿浸透圧が上昇（高Na血症）している状態。治療 では電解質濃度の低い輸液（低張性電解質輸液など）で自由水を補い、浸透圧を是正する。","type":"tf","answer":"○"},{"id":"Q1-6","question":"低張性電解質輸液は血漿より浸透圧が高い","section":"1. 循環・体温・体液","marker":"×","point":"浸透圧は血漿とほぼ同じ（等張）である","explanation":"「低張性電解質輸液」という名称は電解質濃度が生理食塩液より低いことを指すが、輸液製剤自体はブドウ糖など を加えることで血漿とほぼ等しい浸透圧（等張）に調整されている。体内に入った後、ブドウ糖が代謝されて水分のみ が残るため、結果的に自由水を補給する形になる。","type":"tf","answer":"×"},{"id":"Q1-7","question":"高齢者が脱水になりやすい理由として筋肉量が少ないことがあげられる","section":"1. 循環・体温・体液","marker":"○","point":"正しい","explanation":"体内水分の多くは筋肉に含まれる（筋肉は脂肪組織より水分含有率が高い）。高齢者は加齢に伴い筋肉量（除脂肪 体重）が減少するため体内総水分量の割合が若年者より少なく、同じ水分喪失でも脱水になりやすい。加えて口渇中枢 の感受性低下、腎の濃縮力低下なども要因となる。","type":"tf","answer":"○"},{"id":"Q1-8","question":"緊張性気胸は血圧上昇する","section":"1. 循環・体温・体液","marker":"×","point":"血圧は低下しショック状態になる","explanation":"緊張性気胸では胸腔内に空気が逃げ場なく貯留し続け、患側肺だけでなく縦隔・大血管・対側肺を圧迫する。これ により静脈還流が著しく障害され心拍出量が低下し、血圧低下・頻脈などの閉塞性ショックをきたす致死的な病態であ る。","type":"tf","answer":"×"},{"id":"Q2-1","question":"喘息の患者は症状がないときも吸入薬を使う必要がある","section":"2. 呼吸器","marker":"○","point":"正しい（常に気道に炎症がある）","explanation":"気管支喘息は発作時だけでなく、症状のない寛解期にも気道に慢性的な好酸球性炎症が持続している。そのため長 期管理薬（吸入ステロイドなど抗炎症薬）を症状の有無にかかわらず継続することが治療の基本となる。","type":"tf","answer":"○"},{"id":"Q2-2","question":"2型呼吸不全は換気障害である","section":"2. 呼吸器","marker":"○","point":"正しい","explanation":"呼吸不全はPaO2低下のみのI型（低酸素性）と、PaO2低下に加えPaCO2上昇（45mmHg以上）を伴うII型（高二酸化炭 素血症性）に分類される。II型は肺胞低換気（換気障害）が本態で、CO2の排出が不十分になることで生じる。","type":"tf","answer":"○"},{"id":"Q2-3","question":"肺高血圧は左心不全である","section":"2. 呼吸器","marker":"×","point":"右心不全をきたす","explanation":"肺高血圧症では肺動脈圧が上昇するため、肺動脈へ血液を送り出す右心室の後負荷が増大する。これにより右心室 が肥大・拡張し、進行すると右心不全（右心系のポンプ失調）をきたす。左心不全は肺高血圧の原因になることはあっ ても、「肺高血圧＝左心不全」という定義ではない。","type":"tf","answer":"×"},{"id":"Q2-4","question":"肺血栓があると右心に負担がかかる","section":"2. 呼吸器","marker":"○","point":"正しい","explanation":"肺血栓塞栓症では肺動脈が閉塞し肺血管抵抗が急激に上昇するため、右心室は高い抵抗に逆らって血液を拍出しな ければならず後負荷が増大し、急性右心負荷（右心不全、急性肺性心）を生じる。","type":"tf","answer":"○"},{"id":"Q2-5","question":"肺気腫は肺胞面積を小さくする","section":"2. 呼吸器","marker":"○","point":"正しい（肺胞壁が破壊されつながる疾患）","explanation":"肺気腫は肺胞壁（隔壁）が炎症により破壊され、複数の肺胞が融合して大きな気腔（ブラ）を形成する疾患。個々 の肺胞構造が失われるため、ガス交換に必要な実効的な肺胞表面積（総面積）はかえって減少する。","type":"tf","answer":"○"},{"id":"Q3-1","question":"最も正確なGFRの測定はクレアチニンクリアランスである","section":"3. 腎・電解質・血液浄化","marker":"×","point":"イヌリンクリアランスが最も正確（ゴールドスタンダード）","explanation":"イヌリンは糸球体で自由に濾過された後、尿細管でほとんど再吸収も分泌もされないため、GFR測定の基準（ゴー ルドスタンダード）とされる。クレアチニンは尿細管からわずかに分泌されるため、クレアチニンクリアランスは実際 のGFRをやや過大評価する。","type":"tf","answer":"×"},{"id":"Q3-2","question":"24時間畜尿で塩分摂取量がわかる","section":"3. 腎・電解質・血液浄化","marker":"○","point":"正しい（タンパク質摂取量も推定可能）","explanation":"摂取したナトリウムのほとんどは尿中に排泄されるため、24時間蓄尿中のNa排泄量から食塩摂取量を推定できる。 同様に尿中尿素窒素排泄量からタンパク質摂取量を推定することも可能である。","type":"tf","answer":"○"},{"id":"Q3-3","question":"腹膜透析は血液透析より通院回数が少なくできる","section":"3. 腎・電解質・血液浄化","marker":"○","point":"正しい","explanation":"腹膜透析（PD）は自宅で自分の腹膜を利用して毎日透析液を交換する方法であり、通院は月1〜2回程度で済む。一 方、血液透析（HD）は通常週3回、施設に通院して行う必要がある。","type":"tf","answer":"○"},{"id":"Q3-4","question":"肝硬変では低ナトリウム血症が起きる","section":"3. 腎・電解質・血液浄化","marker":"○","point":"正しい（抗利尿ホルモンの影響で水再吸収が増加）","explanation":"肝硬変では有効循環血漿量の低下を代償するためレニン-アンジオテンシン-アルドステロン系や抗利尿ホルモン（ ADH）が活性化される。ADH増加により腎集合管での水の再吸収が過剰に促進され、Naの喪失以上に水分が貯留するため 、希釈性の低Na血症が生じる。","type":"tf","answer":"○"},{"id":"Q3-5","question":"ネフローゼ症候群の浮腫の原因は何か","section":"3. 腎・電解質・血液浄化","marker":"！","point":"低アルブミン血症による血漿膠質浸透圧の低下","explanation":"ネフローゼ症候群では糸球体障害により高度な蛋白尿（特にアルブミン）が持続し、低アルブミン血症をきたす。 血漿膠質浸透圧が低下すると血管内に水分を保持できなくなり、水分が間質へ移動して浮腫が生じる（古典的機序）。 加えて有効循環血漿量の低下に伴う二次的なRAA系亢進・Na/水貯留も浮腫を助長する。","type":"review","answer":null},{"id":"Q3-6","question":"嘔吐し脱水の患者に生理食塩水投与した","section":"3. 腎・電解質・血液浄化","marker":"○","point":"適切な対応","explanation":"嘔吐では胃液とともに水分・電解質（H＋、Cl−など）が失われ、循環血漿量減少を伴う脱水（代謝性アルカローシ スを合併しやすい）となる。等張液である生理食塩水は細胞外液量の補充に適しており、初期対応として妥当である。","type":"tf","answer":"○"},{"id":"Q4-1","question":"子宮腺筋症では過多月経が起こる","section":"4. 婦人科","marker":"○","point":"正しい（子宮全体が膨らむため）","explanation":"子宮腺筋症は子宮内膜組織が子宮筋層内に浸潤性に増殖する疾患で、子宮全体がびまん性に肥大する。子宮内膜の 面積・血流が増えることや筋層の収縮不全により、月経時の出血量が増加する過多月経や強い月経痛を呈しやすい。","type":"tf","answer":"○"},{"id":"Q4-2","question":"子宮筋腫では病変と子宮筋の境界が明瞭である","section":"4. 婦人科","marker":"○","point":"正しい（筋腫は明瞭、腺筋症は不明瞭）","explanation":"子宮筋腫は平滑筋細胞由来の腫瘍で被膜（偽被膜）を持ち、周囲の正常子宮筋との境界がはっきりしている（結節 性）。一方、子宮腺筋症は内膜組織がびまん性に筋層内に浸潤するため境界が不明瞭である。この違いは画像診断（MRI ・超音波）での鑑別に重要である。","type":"tf","answer":"○"},{"id":"Q4-3","question":"プロゲステロンのみのホルモン剤がある","section":"4. 婦人科","marker":"○","point":"正しい","explanation":"プロゲスチン単剤製剤（黄体ホルモン単独製剤）は臨床で用いられる。エストロゲンを併用しないことで、エスト ロゲンにより子宮内膜が過剰に増殖するリスクを避けられるため、内膜保護目的や特定の病態（子宮内膜症など）で選 択される。エストロゲンとの配合剤（低用量ピルなど）も別に存在する。","type":"tf","answer":"○"},{"id":"Q4-4","question":"更年期障害の症状として骨折の頻度が高い","section":"4. 婦人科","marker":"×","point":"自律神経失調症状（ほてり、発汗、動悸など）が主体","explanation":"更年期障害の代表的症状はエストロゲン急激な低下に伴うホットフラッシュ、発汗、動悸、めまい、イライラなど の自律神経失調症状・精神症状である。骨折はエストロゲン欠乏に伴う骨粗鬆症の進行により長期的なリスクとして高 まるものであり、更年期障害そのものの急性症状として直接「骨折の頻度が高い」とするのは誤り。","type":"tf","answer":"×"},{"id":"Q4-5","question":"HRT（ホルモン補充療法）は深部静脈血栓症の既往がある人には行わない","section":"4. 婦人科","marker":"○","point":"正しい（血栓ができやすくなるため）","explanation":"エストロゲンを含むHRTは凝固因子に影響を与え血栓形成傾向を高めることが知られており、深部静脈血栓症（DVT ）や肺塞栓症の既往がある患者は禁忌または慎重投与の対象となる。","type":"tf","answer":"○"},{"id":"Q5-1","question":"食道内腔面の円柱上皮が認められる部分には化生がおこっている","section":"5. 消化器","marker":"○","point":"正しい（バレット食道）","explanation":"食道の正常粘膜は重層扁平上皮だが、慢性的な胃酸逆流（逆流性食道炎）の刺激により、下部食道の扁平上皮が円 柱上皮（腸上皮化生を伴うことが多い）に置き換わることがある。これを「バレット食道」と呼び、化生（組織型の変 化）の代表例であり、食道腺癌の risk factor として重要視される。","type":"tf","answer":"○"},{"id":"Q5-2","question":"胃食道逆流症は食後腹痛が増すか","section":"5. 消化器","marker":"○","point":"正しい（胃酸分泌が亢進するため悪化しやすい。ただしGERDの主症状は「腹痛」というより胸 やけ・呑酸である点に注意）","explanation":"食後は消化のため胃酸分泌が亢進し胃内容量・胃内圧も増加するため、下部食道括約筋の機能不全がある逆流性食 道炎（GERD）患者では食後に症状が悪化しやすい。ただしGERDの代表的症状は胸やけ・呑酸（酸っぱいものが上がって くる感じ）であり、「腹痛」はやや不正確な表現。心窩部痛を伴うこともあるが、設問文の「腹痛」が具体的に何を指 すかは原本の文言で確認することが望ましい。","type":"tf","answer":"○"},{"id":"Q5-3","question":"アルコール性肝炎は治らないか","section":"5. 消化器","marker":"×","point":"禁酒すれば改善の見込みがある","explanation":"アルコール性肝炎は過剰飲酒により肝臓に炎症が生じる病態だが、可逆性の病態であり、厳格な禁酒と適切な治療 により肝機能の改善が期待できる。ただし重症例や飲酒を継続した場合は肝硬変へ進行し不可逆的な障害を残すことが ある。","type":"tf","answer":"×"},{"id":"Q5-4","question":"胆石が一番できやすいのは胆嚢である","section":"5. 消化器","marker":"○","point":"正しい","explanation":"胆石は胆汁の成分（コレステロール、ビリルビンなど）が結晶化して形成される。胆汁が濃縮・貯留される胆嚢は 胆石が最も生成されやすい部位であり、臨床的に頻度の高い「胆嚢結石」がこれにあたる（総胆管結石や肝内結石より 頻度が高い）。","type":"tf","answer":"○"},{"id":"Q5-5","question":"脂肪肝はエコーで白く映る","section":"5. 消化器","marker":"○","point":"正しい（肝腎コントラストの増加）","explanation":"脂肪肝では肝細胞に脂肪滴が沈着し、超音波（エコー）に対する反射（輝度）が増加するため肝実質が白く（高輝 度に）描出される。同時に隣接する腎皮質との輝度差（肝腎コントラスト）が増大することが診断所見の一つとなる。","type":"tf","answer":"○"},{"id":"Q5-6","question":"肝硬変患者には就寝前食事をとらないよう指導する","section":"5. 消化器","marker":"×","point":"就寝前の夜食（就寝前軽食：LES）を勧める","explanation":"肝硬変では肝でのグリコーゲン貯蔵能が低下しており、夜間の絶食時間が長くなると容易に飢餓状態（低血糖・タ ンパク異化亢進）に陥る。そのため就寝前に軽食（LES: Late Evening Snack、200kcal程度の炭水化物など）を摂取することが栄養療法として推奨されている。","type":"tf","answer":"×"},{"id":"Q6-1","question":"HDLはVLDLからコレステロールが抜かれたものである","section":"6. 脂質異常症・代謝","marker":"×","point":"誤り","explanation":"VLDL（超低比重リポ蛋白）は肝臓で合成された中性脂肪（トリグリセリド）を末梢組織へ運搬する過程でIDL、さ らにLDLへと変化していく（LDLはコレステロールを多く含む）。一方HDL（高比重リポ蛋白）は末梢組織の余分なコレス テロールを回収し肝臓へ戻す役割（コレステロール逆転送）を担うもので、肝臓や小腸で別に産生される。VLDLから直 接HDLが生じるわけではない。","type":"tf","answer":"×"},{"id":"Q6-2","question":"カイロミクロンは肝臓で合成された中性脂肪を運ぶ","section":"6. 脂質異常症・代謝","marker":"×","point":"食事（腸管）由来の脂質を運ぶ","explanation":"カイロミクロンは小腸で食事から吸収された脂質（主に中性脂肪）をリンパ管・血中に取り込み全身へ運搬するリ ポ蛋白である。肝臓で合成された中性脂肪を運ぶのはVLDLの役割であり、カイロミクロンとは由来が異なる。","type":"tf","answer":"×"},{"id":"Q6-3","question":"LDLが異常に高い人はアキレス腱の肥厚がみられる","section":"6. 脂質異常症・代謝","marker":"○","point":"正しい","explanation":"家族性高コレステロール血症などLDLコレステロールが著しく高い病態では、コレステロールがアキレス腱などの 腱組織に沈着し「腱黄色腫」を形成する。アキレス腱肥厚は特徴的な身体所見として診断基準にも用いられる。","type":"tf","answer":"○"},{"id":"Q6-4","question":"脂質異常症の人には喫煙回数を減らす指導をする","section":"6. 脂質異常症・代謝","marker":"×","point":"禁煙（回数を減らすのではなく完全にやめる）を指導する","explanation":"喫煙はHDLコレステロールを低下させ動脈硬化を促進する独立した危険因子であり、脂質異常症患者に対しては「 本数を減らす」ではなく「完全な禁煙」が指導される。","type":"tf","answer":"×"},{"id":"Q6-5","question":"糖尿病の人のLDLは140以下にする","section":"6. 脂質異常症・代謝","marker":"×","point":"糖尿病では動脈硬化性疾患の高リスク群として、より厳格な目標値（一般に120mg/dL未満、冠 動脈疾患既往があればさらに低値）が設定される","explanation":"糖尿病は動脈硬化のハイリスク病態であるため、脂質管理目標はより厳しく設定される。日本動脈硬化学会の管理 目標では、糖尿病（他の高リスク病態がない場合）でLDL-C 120mg/dL未満、既に冠動脈疾患がある場合はさらに低い値 （二次予防：100mg/dL未満、家族性高コレステロール血症合併等では70mg/dL未満）が目標とされ、「140以下」は一般 に脂質異常症の中でも低リスク〜境界域の基準に近く、糖尿病患者の目標としては不十分（緩すぎる）。","type":"tf","answer":"×"},{"id":"Q6-6","question":"《脂肪性肝疾患》の純エタノール量の目安（男性/女性）","section":"6. 脂質異常症・代謝","marker":"！","point":"資料記載：男性 〜30g／30〜60g／60g以上、女性 〜20g／20〜50g／60g以上（MASLD・MetALD・ALDの分類境界の目安）","explanation":"現行の国際的な脂肪性肝疾患の分類（MASLD: 代謝機能障害関連脂肪性肝疾患／MetALD: 代謝異常とアルコールが関与する脂肪性肝疾患／ALD: アルコール性肝疾患）は、代謝異常の有無と飲酒量（純エタノー ル換算）の閾値によって区分される。この境界値は資料の数値を目安として用いる想定であり、実際の試験では配布資 料・講義スライドの数値を正として確認することが望ましい。","type":"review","answer":null},{"id":"Q7-1","question":"胼胝は表面の角化細胞が肥大したものである","section":"7. 皮膚科","marker":"○","point":"正しい（鶏眼との区別）","explanation":"胼胝（たこ）は持続的な摩擦・圧迫刺激により角質層（角化細胞）が肥厚したもので、境界が不明瞭で圧痛を伴わ ないことが多い。これに対し鶏眼（うおのめ）は角質が皮膚の内部（真皮方向）に向かって楔状に食い込み、中心に芯 を持ち圧痛を伴う点で区別される。","type":"tf","answer":"○"},{"id":"Q7-2","question":"光アレルギー性皮膚炎は光に当たって数時間以内に発症する","section":"7. 皮膚科","marker":"×","point":"感作（一定の潜伏期間）を経て発症する","explanation":"光アレルギー性皮膚炎はIV型アレルギー機序で、光により変化した物質（光アレルゲン）に対する感作が成立した 上で発症するため、初回曝露から発症まで数日〜1〜2週間程度の感作期間を要する。光に当たって「数時間以内」に生 じるのは、光毒性皮膚炎（アレルギー機序を介さない直接的な傷害反応）の特徴である。","type":"tf","answer":"×"},{"id":"Q7-3","question":"紅斑は圧迫すると消失する","section":"7. 皮膚科","marker":"○","point":"正しい（紫斑は消失しない）","explanation":"紅斑は毛細血管の拡張・充血によるものであり、ガラス板などで圧迫すると血液が押し出され一時的に消退する（ 退色する）。一方、紫斑（内出血）は血液が血管外（組織内）に漏出したものであり、圧迫しても消退しない。この圧 迫による退色の有無は臨床的な鑑別に用いられる。","type":"tf","answer":"○"},{"id":"Q7-4","question":"毛根にそって汗疹ができる","section":"7. 皮膚科","marker":"○","point":"正しい","explanation":"汗疹（あせも）はエクリン汗腺の導管が汗や角質などで閉塞し、汗が周囲組織に漏出することで生じる。汗腺・毛 包周囲に一致して小丘疹・小水疱が多発する。","type":"tf","answer":"○"},{"id":"Q7-5","question":"アトピー性皮膚炎は成人期に苔癬化が顕著である","section":"7. 皮膚科","marker":"！","point":"原本では×とされているが、一般に慢性化した病変では苔癬化がみられうるため、出題の意図 （何と比較して「顕著」とするか）を資料で確認することを推奨する","explanation":"アトピー性皮膚炎は年齢により病変の分布・性状が変化する（乳児期は滲出性、幼小児期〜成人期は乾燥・苔癬化 した局面が増える傾向）とされる。この設問が「×」とされている根拠は資料上明記されていないため、実際の講義ス ライド・教科書の記述（年齢別の病型分類）に沿って最終確認することを推奨する。","type":"review","answer":null},{"id":"Q7-6","question":"湿疹は炎症を伴う","section":"7. 皮膚科","marker":"○","point":"正しい","explanation":"湿疹（皮膚炎）は表皮・真皮における炎症性反応であり、紅斑・丘疹・水疱・鱗屑・痂皮などの多彩な病変が組み 合わさって現れる、本質的に「炎症性」の疾患群である。","type":"tf","answer":"○"},{"id":"Q8-1","question":"炎症による腫脹は間質内の滲出液の増加による","section":"8. 血液・免疫・炎症","marker":"○","point":"正しい（血管透過性亢進→血漿成分滲出）","explanation":"炎症の急性期には炎症メディエーター（ヒスタミン、ブラジキニンなど）の作用により血管透過性が亢進し、血漿 タンパクを含む水分（滲出液）が血管外の間質腔へ漏出する。この滲出液貯留が腫脹（発赤・熱感・疼痛とともに炎症 の4主徴の一つ）の主因となる。","type":"tf","answer":"○"},{"id":"Q8-2","question":"炎症メディエーターで血管拡張する","section":"8. 血液・免疫・炎症","marker":"○","point":"正しい","explanation":"ヒスタミン、プロスタグランジン、一酸化窒素（NO）などの炎症メディエーターは血管平滑筋を弛緩させ血管拡張 を引き起こす。これにより局所の血流が増加し、発赤・熱感を生じる。","type":"tf","answer":"○"},{"id":"Q8-3","question":"代謝性アルカローシスでは代償作用によりPaCO2が減少する","section":"8. 血液・免疫・炎症","marker":"×","point":"代償作用によりPaCO2は増加する","explanation":"代謝性アルカローシス（HCO3−増加によるpH上昇）に対する呼吸性代償は、換気を抑制してCO2の排出を減らすこと で行われる。これによりPaCO2が上昇し、pHの過度な上昇を緩和しようとする。よって「PaCO2が減少する」は誤りで、 正しくは「増加する」。","type":"tf","answer":"×"},{"id":"Q8-4","question":"骨髄異形成症候群では抹消血の白血球が減少していることが多い","section":"8. 血液・免疫・炎症","marker":"○","point":"正しい（易感染に注意。ただしMDSの本態は汎血球減少で、病型によっては白血球が保たれる こともある点に留意）","explanation":"骨髄異形成症候群（MDS）は造血幹細胞の異常により無効造血をきたす疾患群で、末梢血では貧血・血小板減少・ 白血球減少（好中球減少）が組み合わさる汎血球減少が基本的な血液像である。頻度としては白血球減少を伴う例が多 く、易感染性のリスクが高まる点は正しいが、病型（WHO分類上のサブタイプ）によっては白血球数が保たれる、あるい は単一系統のみの減少にとどまる例もあるため、「白血球減少が多い」という表現はやや断定的である点に留意してほ しい。","type":"tf","answer":"○"},{"id":"Q8-5","question":"悪性貧血は胃がんの発症率をあげる","section":"8. 血液・免疫・炎症","marker":"○","point":"正しい","explanation":"悪性貧血は自己免疫性の萎縮性胃炎（A型胃炎）により内因子・胃酸分泌が低下しビタミンB12欠乏をきたす病態。 この背景にある慢性萎縮性胃炎そのものが胃がん発症のリスク因子として知られており、悪性貧血患者では胃がんの発 症率が高いとされる。","type":"tf","answer":"○"},{"id":"Q8-6","question":"アポトーシスは炎症が起こる","section":"8. 血液・免疫・炎症","marker":"×","point":"炎症が起こるのはネクローシスである","explanation":"アポトーシス（プログラム細胞死）は細胞が秩序立って縮小・断片化し、周囲の細胞に貪食される過程で細胞内容 物が漏出しないため、基本的に炎症反応を惹起しない。一方、ネクローシス（壊死）は細胞膜が破綻し細胞内容物が周 囲に漏出するため、強い炎症反応を引き起こす。","type":"tf","answer":"×"},{"id":"Q8-7","question":"広範囲の外傷はDIC発症につながる","section":"8. 血液・免疫・炎症","marker":"○","point":"正しい","explanation":"広範囲の組織損傷（外傷、熱傷、手術など）では組織因子（トロンボプラスチン）が大量に血中に放出され凝固系 が過剰に活性化される。これにより全身で微小血栓が多発すると同時に凝固因子・血小板が消費され、播種性血管内凝 固症候群（DIC）を発症しうる。","type":"tf","answer":"○"},{"id":"Q8-8","question":"がんによる悪液質はサイトカインの作用を介する","section":"8. 血液・免疫・炎症","marker":"○","point":"正しい","explanation":"がん悪液質（進行性の体重減少・筋肉量減少を特徴とする代謝異常症候群）は、腫瘍やそれに反応する宿主免疫細 胞から放出されるTNF-α、IL-6などの炎症性サイトカインが、食欲低下・エネルギー代謝異常・筋タンパク分解を引き 起こすことが主要な機序とされる。","type":"tf","answer":"○"},{"id":"Q8-9","question":"血栓性血小板減少性紫斑病（TTP）は自己免疫疾患である","section":"8. 血液・免疫・炎症","marker":"！","point":"後天性TTPは自己免疫疾患（ADAMTS13に対する自己抗体）だが、先天性TTP（Upshaw-Schulman 症候群）は遺伝子異常による疾患であり自己免疫ではない","explanation":"TTPはVWF切断酵素ADAMTS13の活性低下により発症する。後天性TTPはADAMTS13に対する自己抗体（インヒビター） が原因の自己免疫疾患だが、先天性TTPはADAMTS13遺伝子の異常による常染色体劣性遺伝疾患である。したがって「TTP は自己免疫疾患である」を単純に○とするか×とするかは、設問が先天性・後天性のどちらを指しているかで変わるた め、出題の文脈（授業資料の記載）に沿って最終確認が必要。次の項目「TTPの原因は自己抗体か」と合わせて整理する と理解しやすい。","type":"review","answer":null},{"id":"Q8-10","question":"TTPの原因は自己抗体か","section":"8. 血液・免疫・炎症","marker":"○","point":"正しい（ただし後天性TTPに限る。ADAMTS13に対する自己抗体が原因）","explanation":"後天性TTPでは、VWF切断酵素ADAMTS13に対する自己抗体（多くはIgG型の中和抗体）が産生され、ADAMTS13活性が 著減することで超高分子量VWFマルチマーが切断されずに残り、微小血管に血小板血栓が多発する。ステロイドや血漿交 換療法（自己抗体除去を含む）が治療の中心となる。","type":"tf","answer":"○"},{"id":"Q8-11","question":"特発性血小板減少性紫斑病（ITP）では血小板が減少するか","section":"8. 血液・免疫・炎症","marker":"○","point":"正しい","explanation":"ITP（免疫性血小板減少症）は血小板膜蛋白に対する自己抗体が産生され、主に脾臓での血小板破壊が亢進するこ とで血小板減少をきたす自己免疫疾患である。血小板数10万/μL未満を血小板減少の目安とする。","type":"tf","answer":"○"},{"id":"Q8-12","question":"溶血性貧血では網状赤血球がみられるか","section":"8. 血液・免疫・炎症","marker":"○","point":"正しい","explanation":"溶血性貧血では赤血球の破壊が亢進するため、骨髄はこれを代償しようと未熟な赤血球（網状赤血球）の産生・放 出を増加させる。そのため末梢血中の網状赤血球比率（％）が上昇することが診断・鑑別の重要な手がかりとなる。","type":"tf","answer":"○"},{"id":"Q9-1","question":"脳死状態では反射は消失する","section":"9. 脳神経・感覚器","marker":"！","point":"脳死で消失するのは脳幹反射（対光反射、角膜反射、咽頭反射など）であり、脊髄を介する深 部腱反射（膝蓋腱反射など）は残存しうる。「反射」が何を指すかで○×が変わる","explanation":"脳死は「全脳機能の不可逆的な喪失」であり、脳幹反射（対光反射、角膜反射、咽頭反射など）は消失することが 診断基準の一つとなるが、脊髄を介する深部腱反射（膝蓋腱反射など）は脳とは独立した脊髄レベルの反射弓であるた め、脳死後も残存することがある。","type":"review","answer":null},{"id":"Q9-2","question":"伝音性難聴は気道聴力、骨導聴力ともに低下する","section":"9. 脳神経・感覚器","marker":"×","point":"気道聴力のみ低下する","explanation":"伝音性難聴は外耳・中耳（鼓膜・耳小骨）の障害により音の伝導が妨げられるもので、骨導（頭蓋骨を介して直接 内耳に振動を伝える経路）は障害されないため骨導聴力は正常に保たれ、気導聴力のみが低下する。オージオグラムで 気導骨導差（air-bone gap）が生じることが特徴。","type":"tf","answer":"×"},{"id":"Q9-3","question":"耳硬化症は伝音性難聴である","section":"9. 脳神経・感覚器","marker":"○","point":"正しい","explanation":"耳硬化症はアブミ骨の可動性が異常な骨増殖により障害される疾患で、音の振動が内耳へ伝わりにくくなるため伝 音性難聴を呈する。","type":"tf","answer":"○"},{"id":"Q9-4","question":"滲出性中耳炎は鼓膜が内側に陥凹している","section":"9. 脳神経・感覚器","marker":"○","point":"正しい","explanation":"滲出性中耳炎では耳管機能不全により中耳腔が陰圧化し、鼓膜が内側へ引き込まれる（陥凹する）とともに、中耳 腔に滲出液（貯留液）が貯まる。急性の強い炎症症状（発熱・耳痛）を伴わないことが多い。","type":"tf","answer":"○"},{"id":"Q9-5","question":"突発性難聴は気道聴力、骨導聴力どちらも低下している","section":"9. 脳神経・感覚器","marker":"○","point":"正しい（感音性難聴）","explanation":"突発性難聴は内耳（蝸牛神経）レベルの障害による感音性難聴であり、音の伝導路（気導）だけでなく、内耳の感 覚受容そのものが障害されるため骨導聴力も低下する。伝音性難聴（気導のみ低下）との重要な鑑別点である。","type":"tf","answer":"○"},{"id":"Q9-6","question":"メニエール病のめまいは頭を特定の方向に向けたときに起こる","section":"9. 脳神経・感覚器","marker":"×","point":"これは良性発作性頭位めまい症（BPPV）の特徴","explanation":"メニエール病は内リンパ水腫を原因とし、回転性めまい発作が難聴・耳鳴りを伴い自然発症する（頭位変換とは直 接関連しない）。一方、頭を特定方向に向けた際に誘発される短時間の回転性めまいは、耳石の異常による良性発作性 頭位めまい症（BPPV）の特徴であり、両者は鑑別すべき別疾患である。","type":"tf","answer":"×"},{"id":"Q9-7","question":"メニエール病は発作がないときでも聴力が低下する","section":"9. 脳神経・感覚器","marker":"○","point":"正しい（進行すると間欠期にも聴力低下）","explanation":"メニエール病初期は発作時のみ一過性に聴力が低下し間欠期には回復するが、発作を繰り返し病態が進行すると、 内耳障害が蓄積して間欠期（発作のない時期）にも聴力低下が持続するようになる。","type":"tf","answer":"○"},{"id":"Q9-8","question":"頭蓋内圧亢進では血圧が低下し頻脈になる","section":"9. 脳神経・感覚器","marker":"×","point":"血圧は上昇し徐脈になる（クッシング徴候）","explanation":"頭蓋内圧が亢進すると脳灌流圧を保つため代償的に血圧が上昇し、それに反応した圧受容器反射により徐脈をきた す（血圧上昇・徐脈・呼吸不規則の組み合わせを「クッシング徴候」と呼ぶ）。放置すると脳ヘルニアなど致死的な状 態に至るため重要な所見である。","type":"tf","answer":"×"},{"id":"Q9-9","question":"老視で光がまぶしく感じる","section":"9. 脳神経・感覚器","marker":"×","point":"老視（老眼）は水晶体の弾力低下による調節力低下（近くが見えにくくなる）が本態で、羞明 （まぶしさ）は主症状ではない","explanation":"老視は加齢により水晶体の弾力性が低下し、近くにピントを合わせる調節力が衰える現象で、主症状は近方視力の 低下である。まぶしさ（羞明）は白内障などの水晶体混濁や角膜疾患でみられる症状であり、老視そのものの特徴では ない。","type":"tf","answer":"×"},{"id":"Q9-10","question":"糖尿病は白内障の危険因子である","section":"9. 脳神経・感覚器","marker":"○","point":"正しい","explanation":"高血糖状態が持続すると水晶体内のソルビトール（ポリオール代謝経路）が蓄積し、水晶体の混濁（糖尿病性白内 障）を促進する。糖尿病は白内障の重要な危険因子の一つである。","type":"tf","answer":"○"},{"id":"Q9-11","question":"正常眼圧緑内障は視力低下しやすい","section":"9. 脳神経・感覚器","marker":"×","point":"視力低下ではなく視野障害が主体で、緩徐に進行し自覚症状に乏しいことが多い","explanation":"緑内障（正常眼圧緑内障を含む）は視神経が障害される疾患で、中心視力よりも先に周辺視野から視野欠損が進行 する。進行が緩徐で自覚症状に乏しいため発見が遅れやすく、末期に至るまで中心視力（見え方の鮮明さ）は比較的保 たれることが多い。「視力低下しやすい」という表現は病態の中心的特徴とは言えない。","type":"tf","answer":"×"},{"id":"Q9-12","question":"緑内障は視神経乳頭の陥凹である","section":"9. 脳神経・感覚器","marker":"！","point":"視神経乳頭陥凹拡大は緑内障の特徴的な眼底所見の一つだが、「緑内障＝視神経乳頭の陥凹」 という定義そのものではない","explanation":"緑内障は眼圧などの要因により視神経が障害され特徴的な視野障害をきたす疾患群であり、視神経乳頭の陥凹拡大 （cupping）はその代表的な眼底所見である。所見と疾患定義を同一視する記述には注意が必要で、設問の趣旨（原文で の×の根拠）は資料で最終確認することが望ましい。","type":"review","answer":null},{"id":"Q9-13","question":"網膜剥離は激痛である","section":"9. 脳神経・感覚器","marker":"×","point":"網膜剥離自体には知覚神経がなく、通常痛みを伴わない","explanation":"網膜には痛覚を感じる神経終末がほとんど存在しないため、網膜剥離は基本的に無痛性である。自覚症状としては 飛蚊症の増加、光視症、視野の一部が欠ける（カーテンがかかったように見える）などが特徴で、「激痛」を伴うこと は典型的ではない。","type":"tf","answer":"×"},{"id":"Q10-1","question":"脳出血はCTですぐにわかる","section":"10. 脳血管障害","marker":"○","point":"正しい","explanation":"脳出血（急性期）はCTで高吸収域（白く）として明瞭に描出されるため、発症早期からの診断に優れる。脳梗塞超 急性期はCTでの変化に乏しいことが多く、この点で脳出血とは対照的である。","type":"tf","answer":"○"},{"id":"Q10-2","question":"クモ膜下出血の患者の約半数で項部硬直がみられる","section":"10. 脳血管障害","marker":"○","point":"正しい（ただし「約半数」という数値は出典・時期により幅があるため、資料の数値を優先）","explanation":"クモ膜下出血では血液がクモ膜下腔（髄液腔）に広がり髄膜刺激症状を引き起こすため、項部硬直（首を前屈させ ようとすると抵抗・疼痛を生じる所見）が出現しうる。ただし発症直後（数時間以内）には髄膜刺激症状が未出現のこ とも多く、出血量や発症からの経過時間によって出現頻度は変動する。「約半数」という具体的な数値は教科書・資料 によって幅があるため、講義で使われた資料の数値を優先して確認してほしい。","type":"tf","answer":"○"},{"id":"Q10-3","question":"クモ膜下出血後1週間程度で脳虚血症状がみられる","section":"10. 脳血管障害","marker":"○","point":"正しい","explanation":"クモ膜下出血後は、出血によって生じた血液分解産物などが脳血管を刺激し、発症後4日〜2週間程度（ピークは7 〜10日前後）に脳血管攣縮（スパズム）が生じ、これにより脳虚血症状（遅発性脳虚血）をきたすことがある重要な合 併症である。","type":"tf","answer":"○"},{"id":"Q10-4","question":"小児のモヤモヤ病は激しく泣いたときに脳出血が起きることが多い","section":"10. 脳血管障害","marker":"×","point":"脳虚血（一過性脳虚血発作）が起きやすい","explanation":"もやもや病（ウィリス動脈輪閉塞症）では、笛を吹く・激しく泣く・過呼吸などにより過換気となり脳血管が収縮 すると、もともと狭窄した主幹脳動脈からの血流がさらに低下し、小児では特に虚血症状（一過性脳虚血発作・脳梗塞 様症状）を誘発しやすい。成人発症例では脳出血型もみられるが、小児での典型的な誘因症状は虚血症状である。","type":"tf","answer":"×"},{"id":"Q10-5","question":"急性硬膜外血腫は頭部の衝撃後数時間たってから意識障害が起きることがある","section":"10. 脳血管障害","marker":"○","point":"正しい（硬膜下血腫との混同に注意）","explanation":"急性硬膜外血腫は受傷直後は意識清明であることが多く（lucid interval：意識清明期）、その後血腫が拡大する につれて数時間後に急激な意識障害・瞳孔異常などが出現することが特徴的である。この経過は急性硬膜下血腫（受傷 直後から意識障害が持続することが多い）とは区別すべき重要なポイントである。","type":"tf","answer":"○"},{"id":"Q11-1","question":"尿素呼気試験はピロリ菌がアンモニアを分解したことを検出する","section":"11. 消化管ピロリ菌・その他","marker":"×","point":"ピロリ菌が分解するのは尿素であり、アンモニアは分解によって生じる側（生成物）である。 検出しているのはこの反応で生じた二酸化炭素","explanation":"尿素呼気試験は、ピロリ菌が持つウレアーゼという酵素が尿素を分解してアンモニアと二酸化炭素を生成する性質 を利用する。設問文は「アンモニアを分解」となっているが、これは反応の向きが逆で、正しくは「尿素を分解してア ンモニアと二酸化炭素を生成する」。標識した尿素を服用させ、分解によって生じた二酸化炭素（呼気中）を測定する ことでピロリ菌感染の有無を判定する。原本資料では〇と判定されていたが、設問文どおりに読むと記述が誤っている ため、本解説では×として扱う。実際の試験問題の文言（「尿素を分解」だった可能性がある）を必ず確認してほしい 。","type":"tf","answer":"×"},{"id":"CASE-1","section":"12. 事例問題","type":"special","question":"脳梗塞急性期のrt-PA（アルテプラーゼ）静注による血栓溶解療法は、発症から何時間以内が適応時間の目安か。","answer":"発症から4.5時間以内","point":"発症から4.5時間以内","explanation":"脳梗塞急性期に行うrt-PA（アルテプラーゼ）静注による血栓溶解療法には時間制限があり、資料では発症から4.5時間以内が鍵となる知識として示されている。"},{"id":"CASE-2","section":"12. 事例問題","type":"special","question":"腎機能障害で体液が貯留した患者について、関連して注意すべきことを2つ答えよ。","answer":"肺水腫のリスク上昇・高カリウム血症（K排泄低下）","point":"血清K正常値：3.5〜5.0 mEq/L。腎機能障害では体液貯留により肺水腫のリスクが高まる。","explanation":"腎機能が低下すると水分・Naの排泄能力が落ちて体液が過剰に貯留し、肺うっ血・肺水腫をきたしうる。またKの排泄も障害されるため高カリウム血症をきたしやすく、不整脈のリスクも高まる。"}],"reference":{"検査値・診断基準":[["Na（血清ナトリウム）","135〜145 mEq/L"],["K（血清カリウム）","3.5〜5.0 mEq/L"],["血液pH","7.35〜7.45"],["PaCO2","35〜45 mmHg"],["HCO3−","22〜26 mEq/L"],["糖尿病診断（空腹時血糖）","126 mg/dL以上"],["糖尿病診断（ブドウ糖負荷後2時間値）","200 mg/dL以上"],["糖尿病診断（HbA1c）","6.5％以上"]],"脂肪性肝疾患・純エタノール摂取量（原本記載）":[["男性｜MASLD相当","〜30g"],["男性｜MetALD相当","30〜60g"],["男性｜ALD相当","60g以上"],["女性｜MASLD相当","〜20g"],["女性｜MetALD相当","20〜50g"],["女性｜ALD相当","60g以上"]]}};
const questions = DATA.questions.map((q,i)=>({...q,index:i}));
let order=[]; let pos=0; let mode='all'; let score=0; let answered=false; let current=null; let currentAnswer=null;
const $=id=>document.getElementById(id);

function loadWrong(){try{return JSON.parse(localStorage.getItem('pathoWrong')||'[]')}catch(e){return []}}
function saveWrong(a){localStorage.setItem('pathoWrong',JSON.stringify([...new Set(a)]))}
function wrongSet(){return new Set(loadWrong())}
function updatePill(){$('wrongPill').textContent=`間違えた問題 ${wrongSet().size}`}
function addWrong(i){const a=loadWrong();if(!a.includes(i))a.push(i);saveWrong(a);updatePill()}
function removeWrong(i){saveWrong(loadWrong().filter(x=>x!==i));updatePill()}
function loadSession(){try{return JSON.parse(localStorage.getItem('pathoSession')||'null')}catch(e){return null}}
function saveSession(){localStorage.setItem('pathoSession',JSON.stringify({mode,order,pos,score,answered,lastAnswer:answered&&current?.type==='tf'?currentAnswer:null}))}
function clearSession(){localStorage.removeItem('pathoSession')}
function shuffle(items){const result=[...items];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}return result}
function start(newMode,resume=false){
  const saved=resume?loadSession():null;
  if(saved){mode=saved.mode;order=saved.order;pos=saved.pos;score=saved.score;answered=false;currentAnswer=saved.lastAnswer||null}
  else{mode=newMode;score=0;pos=0;answered=false;currentAnswer=null;if(mode==='wrong')order=shuffle(questions.map(q=>q.index).filter(i=>wrongSet().has(i)));else order=shuffle(questions.map(q=>q.index));}
  if(!order.length){alert('復習する問題はありません。まず通常モードで問題に取り組んでください。');return}
  $('home').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden'); render();
}
function render(){
  current=questions[order[pos]]; const restoreAnswer=currentAnswer; answered=false; currentAnswer=null;
  $('sectionName').textContent=current.section||'';
  $('progressText').textContent=`${pos+1} / ${order.length}`;
  $('progressBar').style.width=`${((pos)/order.length)*100}%`;
  $('feedbackArea').innerHTML=''; $('actions').innerHTML='';
  const qa=document.createElement('div');
  qa.innerHTML=`<div class="question"><span style="color:var(--accent);font-size:.72em;display:block;margin-bottom:6px">${escapeHtml(current.id)}</span>${escapeHtml(current.question)}</div>`;
  if(current.type==='tf'){
    const c=document.createElement('div');c.className='choices';
    c.innerHTML='<button class="choice" data-a="○">○</button><button class="choice" data-a="×">×</button><button class="choice" data-a="わからない">わからない</button>';
    c.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>answerTF(b.dataset.a)));
    qa.appendChild(c);
  }else{
    const box=document.createElement('div');box.className='notice';box.textContent='この問題は資料内で「！」とされているため、単純な○×ではありません。回答後に正解のポイントを確認してください。';qa.appendChild(box);
    const btn=document.createElement('button');btn.className='primary';btn.style.marginTop='16px';btn.textContent='回答した → 解答・解説を表示';btn.onclick=()=>showSpecial();qa.appendChild(btn);
  }
  $('questionArea').replaceChildren(qa);
  if(restoreAnswer){answered=true;currentAnswer=restoreAnswer;showFeedback(restoreAnswer===current.answer,restoreAnswer)}
}
function answerTF(ans){if(answered)return;answered=true;currentAnswer=ans; const correct=ans===current.answer; if(correct){score++; if(mode==='wrong') removeWrong(current.index)} else if(ans!=='わからない') addWrong(current.index); showFeedback(correct, ans);saveSession()}
function showFeedback(correct, ans){
  const box=document.createElement('div');box.className='feedback '+(correct?'ok':'ng');
  const title=ans==='わからない'?'📘 解答を確認':correct?'✅ 正解':'❌ 不正解';
  box.innerHTML=`<h3>${title}</h3><div class="point">正解：${escapeHtml(current.answer||'資料を確認')}</div><div class="point">正解のポイント：${escapeHtml(current.point||'')}</div><div class="explain">${escapeHtml(current.explanation||'')}</div>`;
  $('feedbackArea').replaceChildren(box); postActions();
}
function showSpecial(){if(answered)return;answered=true; const box=document.createElement('div');box.className='feedback warn';box.innerHTML=`<h3>📘 解答・解説</h3><div class="point">正解のポイント：${escapeHtml(current.point||current.answer||'')}</div><div class="explain">${escapeHtml(current.explanation||'')}</div>`;$('feedbackArea').replaceChildren(box);$('actions').innerHTML='';
  const wrong=document.createElement('button');wrong.className='danger';wrong.textContent='間違えた・要復習に追加';wrong.onclick=()=>{addWrong(current.index);wrong.disabled=true;wrong.textContent='追加しました'};
  const understood=document.createElement('button');understood.className='secondary';understood.textContent='理解した';understood.onclick=()=>{if(mode==='wrong')removeWrong(current.index);postActions();};
  $('actions').append(wrong,understood);
  postActions();saveSession();
}
function postActions(){
  const next=document.createElement('button');next.className='primary';next.textContent=pos+1<order.length?'次の問題 →':'結果を見る';next.onclick=()=>nextQuestion();$('actions').append(next);
}
function nextQuestion(){pos++;if(pos>=order.length){finish();return}currentAnswer=null;saveSession();render()}
function finish(){clearSession(); $('quiz').classList.add('hidden'); $('result').classList.remove('hidden'); const autoTotal=order.filter(i=>questions[i].type==='tf').length; const pct=autoTotal?Math.round(score/autoTotal*100):0; const reviewTotal=order.length-autoTotal; $('resultTitle').textContent=mode==='wrong'?'復習終了':'全問題終了'; $('resultText').textContent=mode==='wrong'?`今回の復習では、○×問題を自動採点しました。その他の問題は解説確認方式です。`:`今回のセッション結果です。○×問題${autoTotal}問を自動採点し、「！」・事例問題${reviewTotal}問は解説確認方式です。`; $('resultScore').textContent=autoTotal?`○×自動採点 ${score} / ${autoTotal}（${pct}%）`:'自動採点なし'; renderWrongList(); updatePill(); $('againWrong').style.display=wrongSet().size?'inline-block':'none'; }
function renderWrongList(){const wrap=$('wrongListWrap'); const ids=[...wrongSet()]; if(!ids.length){wrap.innerHTML='<div class="notice">現在、復習リストは空です。</div>';return} const items=ids.map(i=>questions[i]).filter(Boolean); wrap.innerHTML=`<div style="text-align:left;margin-top:28px;font-weight:800">復習リスト（${items.length}問）</div><div class="wrong-list">${items.map(q=>`<div class="wrong-item"><div class="meta"><strong>${escapeHtml(q.id)} ${escapeHtml(q.question)}</strong><small>${escapeHtml(q.section||'')}</small></div></div>`).join('')}</div>`}
function resetWrong(){if(confirm('間違えた問題の記録をすべて削除しますか？')){saveWrong([]);updatePill();renderWrongList()}}
function escapeHtml(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
const savedSession=loadSession();
if(savedSession){$('startAll').querySelector('strong').textContent='▶ 続きから再開';$('startAll').querySelector('span').textContent='保存されたところから再開します。問題順と回答状況はそのままです。'}
$('startAll').onclick=()=>start('all',Boolean(loadSession()));$('startWrong').onclick=()=>start('wrong');$('againWrong').onclick=()=>start('wrong');$('resetWrong').onclick=resetWrong;$('backHome').onclick=()=>{$('result').classList.add('hidden');$('home').classList.remove('hidden')}; updatePill();
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
